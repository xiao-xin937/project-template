name: 功能需求
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 先说问题和场景，不要直接说方案。这一步决定需求是否成立。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你设想的做法。如果暂时没有想法，留空也可以。

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
      description: 包括「不做」这个选项，以及为什么不够。

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 低（有空再做）
        - 中（本迭代内希望完成）
        - 高（阻塞其他工作）
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考链接、设计稿、类似产品的做法等。
