name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你原本以为会发生什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 越具体越好，能贴最小复现代码最佳
      placeholder: |
        1. 执行 ...
        2. 打开 ...
        3. 看到报错 ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与报错堆栈
      description: 粘贴相关日志。注意先脱敏，去掉密钥、token、真实业务数据。
      render: shell

  - type: input
    id: version
    attributes:
      label: 版本 / commit
      placeholder: v1.2.0 或 commit sha
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 运行环境
      placeholder: Windows 11 / Python 3.12.4
    validations:
      required: true
